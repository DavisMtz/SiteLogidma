<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Atarax</title>
<meta name="description" content="Inicia sesión en Atarax para guardar favoritos y gestionar tu negocio." />
<meta name="theme-color" content="#12100F" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="/fonts/fraunces-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/inter-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="boot" data-boot></div>

<header class="nav" data-nav>
  <a class="nav__brand" href="/" aria-label="Atarax, inicio">
    <svg class="nav__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path d="M4 26V16a12 12 0 0 1 24 0v10" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>
      <path d="M11 26v-9a5 5 0 0 1 10 0v9" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" opacity=".55"/>
    </svg>
    <span>Atarax</span>
  </a>
</header>

<main class="entrar">
  <div class="entrar__caja" data-caja>
    <h1 class="entrar__titulo" data-titulo>Entra a Atarax</h1>
    <p class="entrar__lede" data-lede>
      No necesitas cuenta para buscar. Inicia sesión solo para guardar favoritos
      o gestionar tu negocio.
    </p>

    <p class="aviso" role="alert" data-error hidden></p>

    <a class="btn-google" href="/api/auth/google" data-google>
      <svg viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.02-2.34Z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58Z"/>
      </svg>
      Continuar con Google
    </a>

    <div class="sep" role="separator"><span>o</span></div>

    <form class="acceso" data-form novalidate>
      <label class="acceso__label" for="email">Tu correo</label>
      <input class="acceso__input" id="email" name="email" type="email"
             autocomplete="email" required placeholder="tu@correo.com" />
      <button class="acceso__submit" type="submit" data-submit>Enviarme un enlace</button>
    </form>

    <p class="entrar__nota" data-nota>
      Te mandamos un enlace de un solo uso. Sin contraseñas que recordar.
    </p>

    <p class="entrar__ok" role="status" data-ok hidden></p>
  </div>
</main>

<script src="/entrar.js" defer></script>
</body>
</html>
